[package]
name = "ix"
version = "0.1.0"
edition = "2021"
description = "Assign short numeric slots to anything, expand them anywhere"
repository = "https://github.com/PhantomPayne/ix"
license = "MIT"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ix-{ target }"
bin-dir = "ix"
pkg-fmt = "bin"

[package.metadata.binstall.overrides]
"x86_64-unknown-linux-musl" = { pkg-url = "{ repo }/releases/download/v{ version }/ix-linux-x86_64" }
"aarch64-unknown-linux-gnu" = { pkg-url = "{ repo }/releases/download/v{ version }/ix-linux-aarch64" }
"x86_64-apple-darwin" = { pkg-url = "{ repo }/releases/download/v{ version }/ix-macos-x86_64" }
"aarch64-apple-darwin" = { pkg-url = "{ repo }/releases/download/v{ version }/ix-macos-aarch64" }

[[bin]]
name = "ix"
path = "src/main.rs"

[dependencies]
ix-core = { path = "../ix-core" }
ix-git = { path = "../ix-git" }
ix-sys = { path = "../ix-sys" }
ix-docker = { path = "../ix-docker" }
ix-fs = { path = "../ix-fs" }
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
colored = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
fuzzy-matcher = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
git2 = { workspace = true }
ix-core = { path = "../ix-core" }
serde_json = { workspace = true }
