[workspace]
members = [
    "crates/ix-core",
    "crates/ix-git",
    "crates/ix-sys",
    "crates/ix-docker",
    "crates/ix-fs",
    "crates/ix-env",
    "crates/ix-port",
    "crates/ix-ssh",
    "crates/ix-cat",
    "crates/ix-cli", "crates/ix-stdin",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
sysinfo = "0.30"
bollard = "0.17"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
shell-escape = "0.1.5"

globset = "0.4"
dirs = "5"
tempfile = "3"
indexmap = "2"
