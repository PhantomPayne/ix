[workspace]
members = [
    "crates/ix-core",
    "crates/ix-git",
    "crates/ix-sys",
    "crates/ix-docker",
    "crates/ix-fs",
    "crates/ix-cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
git2 = "0.19"
sysinfo = "0.30"
bollard = "0.17"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
colored = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
fuzzy-matcher = "0.3"
